[project]
name = "projecttemplate-touchdesigner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.10"
dependencies = [
 "tdp-pp1cu",
 "tdp-touchutilcollection>=0.7.3",
]

[dependency-groups]
dev = [ "monkeybrain>=0.4;sys_platform =='win32'",]

[tool.uv.sources]
tdp-pp1cu = { git = "https://github.com/PlusPlusOneGmbH/tdp-pp1cu" }

[tool.monkeybrain]
touchdesigner-version = "2025.32460"
enforce-version = "strict"
projectfile = "Project.toe"

[tool.touchdesigner.TDPyEnvManagerContext]
contextVersion = 2
createdByVersion = "1.4.0"
active = true
mode = "Python vEnv"
envName = ".venv"
installPath = "."
pythonVersion = "3.11"
autoSetup = false
autoSetupReqs = []
autoSetupSyncReqs = false
extraPaths = ["src", ".venv/Lib/site-packages"]


